<!DOCTYPE html>

        body {
            background-color: #202124;
            color: #e8eaed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            font-weight: normal;
            margin-bottom: 40px;
            color: #fff;
        }

        .shortcuts {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 112px;
            height: 112px;
            background-color: #35363a;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
        }

        .shortcut:hover {
            background-color: #45464a;
            transform: translateY(-2px);
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .label {
            font-size: 13px;
            font-weight: 500;
        }

        /* Light Theme Support via Query Param or JS injection later */
        @media (prefers-color-scheme: light) {
             /* Can be handled by JS if we want to sync with main browser theme */
        }
    </style>
</head>
